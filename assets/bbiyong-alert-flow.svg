<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">화재 경보 처리 흐름</title>
<desc id="d">로봇 브리지가 보낸 화재 경보를 WSS 핸들러가 받아 EventLogService에 넘기고, messageId로 중복을 확인한 뒤 MySQL에 한 번만 저장하고, 저장된 뒤에 로봇 회신, 관제 웹 방송, 알림 워커를 통한 Mattermost 전송을 하는 순서도</desc>
