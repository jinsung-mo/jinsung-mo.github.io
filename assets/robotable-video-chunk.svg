<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 660" width="1440" height="660" role="img" aria-labelledby="t d">
<title id="t">판독 입력 방식별 토큰과 경계 F1</title>
<desc id="d">사람 검수 16편에서 팀 방식(사진 1fps, 30초 창)의 판독 토큰을 100%로 둘 때, 사진 선별은 53%에 F1 0.709, 영상 조각 1fps 60초는 17.7%에 F1 0.731, 영상 조각 0.5fps 120초는 9.4%에 F1 0.708이었고 팀 방식의 F1은 0.674였습니다.</desc>
<rect width="1440" height="660" fill="#ffffff"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<circle cx="66" cy="54" r="7" fill="#2f5945"/>
<text x="84" y="63" font-size="28" font-weight="750" fill="#202d26">판독 입력 방식별 토큰과 경계 F1</text>
<text x="84" y="96" font-size="16" fill="#66756b">사람 검수 16편(73.5분), gemini-3.8-flash. 사진을 한 장씩 보내는 대신 시각을 새긴 저해상도 영상 조각을 보냈습니다.</text>

<text x="430" y="168" font-size="15" font-weight="700" fill="#2f5945">판독 토큰 (팀 방식 = 100%)</text>
<text x="960" y="168" font-size="15" font-weight="700" fill="#2f5945">경계 F1 (±5초, 1에 가까울수록 정확)</text>

<g stroke="#e3e9e1" stroke-width="1">
  <line x1="430" y1="186" x2="430" y2="528"/><line x1="610" y1="186" x2="610" y2="528"/><line x1="790" y1="186" x2="790" y2="528"/>
  <line x1="960" y1="186" x2="960" y2="528"/><line x1="1150" y1="186" x2="1150" y2="528"/><line x1="1340" y1="186" x2="1340" y2="528"/>
</g>
<g font-size="13" fill="#8a978d" text-anchor="middle">
  <text x="430" y="552">0%</text><text x="610" y="552">50%</text><text x="790" y="552">100%</text>
  <text x="960" y="552">0</text><text x="1150" y="552">0.5</text><text x="1340" y="552">1.0</text>
</g>
<line x1="1216.1" y1="186" x2="1216.1" y2="528" stroke="#8a978d" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="1216.1" y="574" font-size="13" fill="#66756b" text-anchor="middle">팀 방식 0.674</text>

<!-- 01 팀 방식 -->
<text x="40" y="221" font-size="18" font-weight="700" fill="#202d26">팀 방식</text>
<text x="40" y="245" font-size="14" fill="#66756b">사진 1fps, 30초 창</text>
<rect x="430" y="207" width="360" height="36" rx="3" fill="#b9c6bb"/>
<text x="802" y="231" font-size="16" font-weight="700" fill="#4b5b50">100%<tspan font-weight="400" fill="#66756b"> 344만</tspan></text>
<rect x="960" y="207" width="256.1" height="36" rx="3" fill="#b9c6bb"/>
<text x="1228" y="231" font-size="16" font-weight="700" fill="#4b5b50">0.674</text>

<!-- 02 사진 선별 -->
<text x="40" y="311" font-size="18" font-weight="700" fill="#202d26">사진 선별</text>
<text x="40" y="335" font-size="14" fill="#66756b">팀의 기존 선별 제안</text>
<rect x="430" y="297" width="190.8" height="36" rx="3" fill="#b9c6bb"/>
<text x="632.8" y="321" font-size="16" font-weight="700" fill="#4b5b50">53%<tspan font-weight="400" fill="#66756b"> 182만</tspan></text>
<rect x="960" y="297" width="269.4" height="36" rx="3" fill="#b9c6bb"/>
<text x="1241.4" y="321" font-size="16" font-weight="700" fill="#4b5b50">0.709</text>

<!-- 03 영상 조각 1fps -->
<text x="40" y="401" font-size="18" font-weight="700" fill="#202d26">영상 조각 1fps</text>
<rect x="178" y="384" width="46" height="24" rx="4" fill="#edf2e9"/>
<text x="201" y="401" font-size="13" font-weight="700" fill="#2f5945" text-anchor="middle">제안</text>
<text x="40" y="425" font-size="14" fill="#66756b">480px, 60초 조각</text>
<rect x="430" y="387" width="63.7" height="36" rx="3" fill="#2f5945"/>
<text x="505.7" y="411" font-size="16" font-weight="700" fill="#2f5945">17.7%<tspan font-weight="400" fill="#66756b"> 61만</tspan></text>
<rect x="960" y="387" width="277.8" height="36" rx="3" fill="#2f5945"/>
<text x="1249.8" y="411" font-size="16" font-weight="700" fill="#2f5945">0.731</text>

<!-- 04 영상 조각 0.5fps -->
<text x="40" y="491" font-size="18" font-weight="700" fill="#202d26">영상 조각 0.5fps</text>
<rect x="194" y="474" width="46" height="24" rx="4" fill="#edf2e9"/>
<text x="217" y="491" font-size="13" font-weight="700" fill="#2f5945" text-anchor="middle">제안</text>
<text x="40" y="515" font-size="14" fill="#66756b">480px, 120초 조각</text>
<rect x="430" y="477" width="33.8" height="36" rx="3" fill="#2f5945"/>
<text x="475.8" y="501" font-size="16" font-weight="700" fill="#2f5945">9.4%<tspan font-weight="400" fill="#66756b"> 32만</tspan></text>
<rect x="960" y="477" width="269" height="36" rx="3" fill="#2f5945"/>
<text x="1241" y="501" font-size="16" font-weight="700" fill="#2f5945">0.708</text>

<line x1="40" y1="596" x2="1400" y2="596" stroke="#d8dfd6"/>
<text x="40" y="624" font-size="14" fill="#66756b">팀 방식보다 F1이 확실히 높은 조건은 1fps 조각입니다(영상 단위 부트스트랩 95% 구간 +0.023 ~ +0.096). 0.5fps 조각은 F1을 지키면서 토큰을 가장 많이 줄였습니다.</text>
<text x="40" y="646" font-size="14" fill="#66756b">16편은 개발 중 여러 번 본 자료라 수치가 낙관적일 수 있고, 아직 팀 결정 전 제안입니다. 숫자 옆 회색 값은 16편 전체 판독 토큰입니다.</text>
</g>
</svg>
